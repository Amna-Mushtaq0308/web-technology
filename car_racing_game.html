<!DOCTYPE html>
<html lang="en">
<head>
    <title>Mini Car Racing Game</title>
    <link rel="stylesheet" href="car_racing_game.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🏎️ SPEED RACER</h1>
            <p>Avoid the traffic and survival</p>
        </div> 
        <div class="scoreboard">
            <div class="score-data">
                <span>SCORE</span>
                <strong>0000</strong>
            </div>
            <div class="score-data">
                <span>SPEED</span>
                <strong>120 KM/H</strong>
            </div>
            <div class="score-data">
                <span>LEVEL</span>
                <strong>01</strong>
            </div>
        </div>
        <div class="road">
            <div class="lane-line left"></div>
            <div class="lane-line right"></div>

            <div class="player_car">
                <div class="window front-window"></div>
                <div class="window back-window"></div>
                <div class="wheel wheel-left"></div>
                <div class="wheel wheel-right"></div>
                <div class="wheel wheel-left-back"></div>
                <div class="wheel wheel-right-back"></div>
                <div class="headlight headlight-left"></div>
                <div class="headlight headlight-right"></div>
                <div class="bumper"></div>
            </div>
            <div class="enemy enemy-car1">
                <div class="window front-window"></div>
                <div class="window back-window"></div>  
                <div class="wheel wheel-left"></div>
                <div class="wheel wheel-right"></div>
                <div class="wheel wheel-left-back"></div>
                <div class="wheel wheel-right-back"></div>   
                <div class="headlight headlight-left"></div>
                <div class="headlight headlight-right"></div>   
                <div class="bumper"></div>
            </div>
            <div class="enemy enemy-car2">
                <div class="window front-window"></div>
                <div class="window back-window"></div>  
                <div class="wheel wheel-left"></div>
                <div class="wheel wheel-right"></div>
                <div class="wheel wheel-left-back"></div>
                <div class="wheel wheel-right-back"></div> 
                <div class="headlight headlight-left"></div>
                <div class="headlight headlight-right"></div>   
                <div class="bumper"></div>
            </div>
            <div class="enemy enemy-car3"> 
                <div class="window front-window"></div> 
                <div class="window back-window"></div> 
                <div class="wheel wheel-left"></div> 
                <div class="wheel wheel-right"></div> 
                <div class="wheel wheel-left-back"></div> 
                <div class="wheel wheel-right-back"></div> 
                <div class="headlight headlight-left"></div> 
                <div class="headlight headlight-right"></div> 
                <div class="bumper"></div> 
        </div>
        </div>
        <div class="instructions">
            <h1>Avoid the cars!</h1>
            <p><= LEFT &nbsp;&nbsp;&nbsp; RIGHT =></p>
        </div>
        <button class="start-button">START</button>
    </div>
</body>
</html>
